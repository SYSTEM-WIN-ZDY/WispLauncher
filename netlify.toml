# Netlify 配置：仅包含站点自身需要的重写规则。
# Build command / Publish directory / Functions directory 在 Netlify UI 中配置：
#   Build command:     pnpm --filter @wisp/website... run build
#   Publish directory: apps/website/dist
#   Functions dir:     netlify/functions
#
# /api/* 由 Netlify Functions 实时转发 CNB 数据（客户端直连 CNB 会被
# CORS 拦截，见 netlify/functions/releases-*.mjs）。

[[redirects]]
from = "/api/releases/latest"
to = "/.netlify/functions/releases-latest"
status = 200

[[redirects]]
from = "/api/releases/catalog"
to = "/.netlify/functions/releases-catalog"
status = 200

[[redirects]]
from = "/api/releases/miawa"
to = "/.netlify/functions/releases-miawa"
status = 200

[[redirects]]
from = "/api/downloads/prepare"
to = "/.netlify/functions/downloads-prepare"
status = 200
